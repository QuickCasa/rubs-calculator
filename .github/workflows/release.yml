name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Check, pack and stage the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Confirm the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - run: npm run check

      - name: Pack the package
        run: npm pack

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: quickcasa-rubs-calculator-*.tgz

      # A version already on npm, such as a first release published by hand or
      # a rerun of this workflow, is left alone.
      - name: Check whether this version is on npm
        id: npm
        run: |
          package="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$package" version > /dev/null 2>&1; then
            echo "$package is already on npm, so it won't be staged."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # npm trusts this workflow through OIDC, so there is no token. The
      # version is staged on npm and goes live once a maintainer approves it
      # with 2FA: npm stage list, then npm stage approve <stage-id>.
      - name: Update npm for trusted publishing
        if: steps.npm.outputs.published != 'true'
        run: npm install --global npm@^11.21.0

      - name: Stage the release on npm
        if: steps.npm.outputs.published != 'true'
        run: npm stage publish . --access public --provenance
